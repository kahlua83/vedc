<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VEDC Signal System</title>
    
    <!-- Hệ thống Favicon chuẩn chính chủ VEDC -->
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="android-chrome-512x512.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Thư viện Supabase chính thức từ CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @keyframes pulse-fast {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .animate-pulse-fast { animation: pulse-fast 0.8s infinite; }

        .responsive-title {
            font-size: clamp(2rem, 6vw, 5rem);
            line-height: 1.1;
        }
        .responsive-subtext {
            font-size: clamp(1rem, 3vw, 2rem);
            line-height: 1.2;
        }
        .responsive-msg {
            font-size: clamp(1.1rem, 3.5vw, 2.5rem);
            line-height: 1.3;
        }
        .responsive-countdown {
            font-size: clamp(1.1rem, 3.5vw, 2rem);
        }
    </style>
</head>
<body id="main-body" class="bg-slate-950 text-white h-screen w-screen flex flex-col justify-between overflow-x-hidden font-sans select-none" style="background-color: #020617; transition: background-color 0.2s ease;">

    <!-- ==================== BƯỚC CÀI ĐẶT BAN ĐẦU ==================== -->
    <div id="setup-view" class="hidden flex-1 flex flex-col justify-center items-center p-4 sm:p-6 text-center bg-slate-950 min-h-screen">
        <div class="bg-slate-900 border-2 border-slate-800 p-6 sm:p-8 rounded-3xl max-w-md w-full shadow-2xl">
            <h1 class="text-2xl sm:text-3xl font-black text-indigo-400 mb-2 flex items-center justify-center gap-2">
                <span>🎛️ VEDC SIGNAL</span>
            </h1>
            <p id="setup-step-title" class="text-slate-400 text-xs sm:text-sm mb-6">Bước 1: Chọn vai trò truy cập hệ thống</p>

            <!-- BƯỚC 1: CHỌN VAI TRÒ -->
            <div id="step-role-container" class="space-y-3 mb-4">
                <button onclick="selectRole('director')" class="w-full py-4 px-4 bg-indigo-600 hover:bg-indigo-500 font-black text-base rounded-2xl transition flex items-center justify-center gap-2 shadow-lg">
                    <span>🎛️ ĐẠO DIỄN (DIRECTOR)</span>
                </button>
                <button onclick="selectRole('caster')" class="w-full py-4 px-4 bg-teal-600 hover:bg-teal-500 font-black text-base rounded-2xl transition flex items-center justify-center gap-2 shadow-lg">
                    <span>📺 MÀN HÌNH HIỂN THỊ (SCREEN)</span>
                </button>
            </div>

            <!-- BƯỚC 2: CHỌN JOB & LOẠI HÌNH BÀN (CASTER HAY MC) -->
            <div id="step-job-container" class="space-y-3 mb-6 hidden">
                <button onclick="selectPresetJob('job1', 'caster')" class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 font-bold rounded-xl transition flex items-center justify-between text-sm sm:text-base">
                    <span>📡 JOB 1 (Bàn Caster)</span>
                    <span class="text-xs bg-indigo-900 px-2 py-1 rounded">CASTER</span>
                </button>
                <button onclick="selectPresetJob('job2', 'mc')" class="w-full py-3 px-4 bg-emerald-600 hover:bg-emerald-500 font-bold rounded-xl transition flex items-center justify-between text-sm sm:text-base">
                    <span>🎤 JOB 2 (Bàn Stage MC)</span>
                    <span class="text-xs bg-emerald-900 px-2 py-1 rounded">MC / HOST</span>
                </button>
                <button onclick="selectPresetJob('job3', 'caster')" class="w-full py-3 px-4 bg-purple-600 hover:bg-purple-500 font-bold rounded-xl transition flex items-center justify-between text-sm sm:text-base">
                    <span>🎙️ JOB 3 (Bàn Tùy chỉnh)</span>
                    <span class="text-xs bg-purple-900 px-2 py-1 rounded">CASTER</span>
                </button>
                
                <div class="pt-3 border-t border-slate-800">
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2 text-left">Hoặc nhập tên Job tùy chỉnh (vd: vmc):</label>
                    <div class="flex gap-2 mb-2">
                        <input type="text" id="custom-job-input" placeholder="Nhập tên job..." class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                    </div>
                    <div class="flex gap-2">
                        <button onclick="submitCustomJob('caster')" class="flex-1 bg-indigo-600 hover:bg-indigo-500 py-2 rounded-xl text-xs font-bold transition">VÀO (BẢN CASTER)</button>
                        <button onclick="submitCustomJob('mc')" class="flex-1 bg-emerald-600 hover:bg-emerald-500 py-2 rounded-xl text-xs font-bold transition">VÀO (BẢN MC)</button>
                    </div>
                </div>

                <div class="pt-2">
                    <button onclick="backToRoleStep()" class="text-xs font-bold text-slate-400 hover:text-white underline">
                        ⬅️ Quay lại chọn vai trò
                    </button>
                </div>
            </div>

            <!-- BƯỚC 3: CHỌN BÀN GỐC -->
            <div id="step-caster-desk-container" class="space-y-3 mb-6 hidden">
                <button onclick="selectCasterDesk('caster_1')" class="w-full py-4 px-4 bg-indigo-600 hover:bg-indigo-500 font-black text-base sm:text-lg rounded-2xl transition flex items-center justify-center gap-2">
                    🎙️ BÀN 1 (MAIN DESK)
                </button>
                <button onclick="selectCasterDesk('caster_2')" class="w-full py-4 px-4 bg-teal-600 hover:bg-teal-500 font-black text-base sm:text-lg rounded-2xl transition flex items-center justify-center gap-2">
                    🎧 BÀN 2 (SUB DESK)
                </button>
                <button onclick="backToJobStep()" class="text-xs font-bold text-slate-400 hover:text-white pt-2 underline">
                    ⬅️ Chọn lại Job khác
                </button>
            </div>
        </div>
    </div>

    <!-- ==================== MÀN HÌNH HIỂN THỊ (SCREEN) ==================== -->
    <div id="caster-view" class="hidden flex-1 flex flex-col justify-center items-center p-3 sm:p-6 text-center relative h-full w-full overflow-hidden">
        
        <button id="btn-caster-reset" class="absolute top-3 right-3 sm:top-4 sm:right-4 bg-black/50 hover:bg-black/80 border border-white/20 px-3 py-1.5 rounded-full text-[11px] sm:text-xs font-bold text-slate-200 transition z-10 shadow">
            🔄 Đổi Cài Đặt
        </button>

        <div id="caster-desk-badge" class="bg-black/60 border border-white/20 px-4 py-1.5 rounded-full text-xs sm:text-sm font-black uppercase tracking-wider text-amber-300 mb-3 shadow-lg">
            Đang kết nối...
        </div>

        <div id="caster-countdown-banner" class="responsive-countdown font-extrabold text-amber-300 bg-black/70 px-6 sm:px-10 py-2 sm:py-3 rounded-2xl mb-3 sm:mb-6 tracking-wider uppercase border-2 border-amber-400/60 hidden animate-pulse-fast shadow-2xl max-w-full">
            ⏱️ ĐẾM NGƯỢC: <span id="caster-timer-num">5</span>s
        </div>

        <div id="status-badge" class="responsive-title font-black uppercase tracking-wider mb-2 sm:mb-4 px-6 sm:px-10 py-3 sm:py-6 rounded-2xl sm:rounded-3xl bg-black/40 shadow-2xl border-2 sm:border-4 border-white/20 max-w-full break-words">
            CONNECTING...
        </div>
        
        <div id="status-subtext" class="responsive-subtext font-bold tracking-wide uppercase opacity-90 mb-3 sm:mb-6 max-w-full break-words">
            Đang kết nối...
        </div>

        <div id="custom-msg" class="responsive-msg font-extrabold max-w-5xl w-full text-amber-300 bg-black/80 border-2 sm:border-4 border-amber-400 px-4 sm:px-6 py-3 sm:py-5 rounded-2xl shadow-2xl hidden animate-pulse-fast break-words">
        </div>

        <!-- Nhãn định danh thương hiệu và Wake Lock ở chân trang -->
        <div class="absolute bottom-2 sm:bottom-3 flex flex-col items-center gap-0.5 opacity-70 pointer-events-none">
            <div class="text-[10px] sm:text-xs font-bold text-slate-300 tracking-wider uppercase">VEDC Broadcast Production System</div>
            <div id="wake-lock-status" class="text-[9px] sm:text-[10px] font-semibold text-slate-400">💡 Screen Wake Lock: Off</div>
        </div>
    </div>

    <!-- ==================== BẢNG ĐIỀU KHIỂN ĐẠO DIỄN (DIRECTOR) ==================== -->
    <div id="director-view" class="hidden flex-1 p-4 sm:p-6 overflow-y-auto max-w-7xl mx-auto w-full">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-6 pb-4 border-b border-slate-800">
            <h1 class="text-2xl sm:text-3xl font-black text-indigo-400 flex items-center gap-2">
                <span>🎛️ BẢNG ĐIỀU KHIỂN TALLY (VEDC)</span>
            </h1>
            <div class="flex items-center gap-2 sm:gap-3 flex-wrap">
                <span id="job-badge" class="bg-amber-950 text-amber-300 border border-amber-700/50 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider">
                    🏷️ Job: Default
                </span>
                <button id="btn-change-job" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 px-3 py-1 rounded-full text-xs font-bold text-slate-300 transition">
                    🔄 Đổi Cài Đặt
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 sm:gap-8">
            <!-- BÀN 1 -->
            <div class="bg-slate-900 border-2 border-slate-800 rounded-3xl p-4 sm:p-6 shadow-xl flex flex-col justify-between">
                <div>
                    <div class="flex justify-between items-center mb-4 gap-2 flex-wrap">
                        <h2 id="title-desk-1" class="text-xl sm:text-2xl font-bold text-slate-100 flex items-center gap-2">
                            <span>🎙️ BÀN 1</span> <span id="type-badge-1" class="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded">CASTER</span>
                        </h2>
                        
                        <div class="flex items-center gap-2">
                            <div class="flex items-center bg-slate-950 border border-slate-700 rounded-xl px-2.5 py-1 text-xs font-bold text-slate-300">
                                <span class="mr-1 text-slate-400">⏱️ Sec:</span>
                                <input type="number" id="input-c1-sec" value="5" min="0" max="60" class="w-10 bg-slate-900 text-center text-white font-black rounded focus:outline-none focus:border-indigo-500 py-0.5">
                            </div>
                            <div id="monitor-c1" class="px-3 py-1.5 rounded-xl text-xs sm:text-sm font-black uppercase bg-slate-800 text-slate-400 border border-slate-700 transition-bg whitespace-nowrap">
                                STANDBY
                            </div>
                        </div>
                    </div>

                    <!-- 8 Nút bấm bàn 1 (Sẽ được render động theo loại Caster hay MC) -->
                    <div id="grid-desk-1" class="grid grid-cols-2 gap-2.5 mb-4">
                        <!-- Render qua Javascript -->
                    </div>
                </div>

                <div class="bg-slate-950/60 p-3.5 sm:p-4 rounded-2xl border border-slate-800">
                    <label class="block text-xs font-bold uppercase mb-2 text-amber-400">⚠️ Chú ý lời nhắc (Bàn 1):</label>
                    <div class="flex gap-2">
                        <input type="text" id="input-c1-msg" placeholder="Gõ lời nhắc khẩn cấp..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs sm:text-sm text-white focus:outline-none focus:border-amber-500">
                        <button id="btn-c1-sendmsg" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-3.5 py-2 rounded-xl text-xs font-black transition whitespace-nowrap">GỬI</button>
                        <button id="btn-c1-clearmsg" class="bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-xl text-xs font-bold text-slate-400 transition whitespace-nowrap">XÓA</button>
                    </div>
                </div>
            </div>

            <!-- BÀN 2 -->
            <div class="bg-slate-900 border-2 border-slate-800 rounded-3xl p-4 sm:p-6 shadow-xl flex flex-col justify-between">
                <div>
                    <div class="flex justify-between items-center mb-4 gap-2 flex-wrap">
                        <h2 id="title-desk-2" class="text-xl sm:text-2xl font-bold text-slate-100 flex items-center gap-2">
                            <span>🎧 BÀN 2</span> <span id="type-badge-2" class="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded">ANALYST</span>
                        </h2>
                        
                        <div class="flex items-center gap-2">
                            <div class="flex items-center bg-slate-950 border border-slate-700 rounded-xl px-2.5 py-1 text-xs font-bold text-slate-300">
                                <span class="mr-1 text-slate-400">⏱️ Sec:</span>
                                <input type="number" id="input-c2-sec" value="5" min="0" max="60" class="w-10 bg-slate-900 text-center text-white font-black rounded focus:outline-none focus:border-indigo-500 py-0.5">
                            </div>
                            <div id="monitor-c2" class="px-3 py-1.5 rounded-xl text-xs sm:text-sm font-black uppercase bg-slate-800 text-slate-400 border border-slate-700 transition-bg whitespace-nowrap">
                                STANDBY
                            </div>
                        </div>
                    </div>

                    <!-- 8 Nút bấm bàn 2 (Sẽ được render động theo loại Caster hay MC) -->
                    <div id="grid-desk-2" class="grid grid-cols-2 gap-2.5 mb-4">
                        <!-- Render qua Javascript -->
                    </div>
                </div>

                <div class="bg-slate-950/60 p-3.5 sm:p-4 rounded-2xl border border-slate-800">
                    <label class="block text-xs font-bold uppercase mb-2 text-amber-400">⚠️ Chú ý lời nhắc (Bàn 2):</label>
                    <div class="flex gap-2">
                        <input type="text" id="input-c2-msg" placeholder="Gõ lời nhắc khẩn cấp..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs sm:text-sm text-white focus:outline-none focus:border-amber-500">
                        <button id="btn-c2-sendmsg" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-3.5 py-2 rounded-xl text-xs font-black transition whitespace-nowrap">GỬI</button>
                        <button id="btn-c2-clearmsg" class="bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-xl text-xs font-bold text-slate-400 transition whitespace-nowrap">XÓA</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPT TÍCH HỢP SUPABASE & ĐỊNH NGHĨA BUTTON SETS -->
    <script type="module">
        const SUPABASE_URL = 'https://omwirirvygtlmvcjrlik.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_zfhPOosE4n_efrG_egojpg_WY7ryv7R';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        let role = urlParams.get('role');
        let casterId = urlParams.get('id');
        let jobId = urlParams.get('job');
        let mode = urlParams.get('mode') || 'caster'; // 'caster' hoặc 'mc'

        function cleanJobId(id) {
            if (!id) return '';
            return id.trim().toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-_]/g, '');
        }

        if (jobId) jobId = cleanJobId(jobId);

        // Định nghĩa 2 bộ nút bấm chuẩn cho Caster và MC
        const CASTER_BUTTONS = [
            { id: 'onair', titleEng: 'STREAM ON AIR', titleVie: 'LUỒNG SÓNG ĐANG PHÁT', bg: '#b91c1c', text: '#ffffff', desc: 'ĐANG PHÁT SÓNG' },
            { id: 'standby', titleEng: 'PREVIEW', titleVie: 'STANDBY / CHUẨN BỊ', bg: '#059669', text: '#ffffff', desc: 'CHUẨN BỊ' },
            { id: 'cam-off', titleEng: 'CASTER XUỐNG HÌNH', titleVie: 'OFF CAM (VẪN BÌNH LUẬN)', bg: '#000000', text: '#ffffff', desc: 'OFF CAM' },
            { id: 'cam-on', titleEng: 'CASTER LÊN HÌNH', titleVie: 'ON CAMERA', bg: '#dc2626', text: '#ffffff', desc: 'ON CAMERA' },
            { id: 'caugio', titleEng: 'CÂU GIỜ', titleVie: 'HOLD TIME', bg: '#f59e0b', text: '#030712', desc: 'HOLD TIME' },
            { id: 'mc', titleEng: 'CHUYỂN VỀ MC', titleVie: 'BACK TO HOST / MC', bg: '#0d9488', text: '#ffffff', desc: 'VỀ MC' },
            { id: 'out', titleEng: 'CASTER OUT', titleVie: 'BÌNH LUẬN XONG', bg: '#2563eb', text: '#ffffff', desc: 'XONG' },
            { id: 'break', titleEng: 'BREAK', titleVie: 'NGHỈ GIẢI LAO', bg: '#9333ea', text: '#ffffff', desc: 'NGHỈ' }
        ];

        const MC_BUTTONS = [
            { id: 'voice-off', titleEng: 'VOICE OFF', titleVie: 'TẮT TIẾNG / OFF VOICE', bg: '#334155', text: '#ffffff', desc: 'OFF VOICE' },
            { id: 'caugio-mc', titleEng: 'CÂU GIỜ', titleVie: 'HOLD TIME', bg: '#f59e0b', text: '#030712', desc: 'HOLD TIME' },
            { id: 'tra-caster', titleEng: 'TRẢ VỀ CASTER', titleVie: 'BACK TO CASTER', bg: '#2563eb', text: '#ffffff', desc: 'VỀ CASTER' },
            { id: 'mg-hoi', titleEng: 'MINIGAME CÂU HỎI', titleVie: 'QUESTION MINIGAME', bg: '#9333ea', text: '#ffffff', desc: 'MINIGAME HỎI' },
            { id: 'mg-lucky', titleEng: 'MINIGAME LUCKY DRAW', titleVie: 'LUCKY DRAW', bg: '#ea580c', text: '#ffffff', desc: 'LUCKY DRAW' },
            { id: 'mg-end', titleEng: 'KẾT THÚC MINIGAME', titleVie: 'END MINIGAME', bg: '#64748b', text: '#ffffff', desc: 'XONG MG' },
            { id: 'giao-luu', titleEng: 'GIAO LƯU KHÁN GIẢ', titleVie: 'AUDIENCE INTERACTION', bg: '#0d9488', text: '#ffffff', desc: 'GIAO LƯU' },
            { id: 'giao-luu-end', titleEng: 'KẾT THÚC GIAO LƯU', titleVie: 'END INTERACTION', bg: '#475569', text: '#ffffff', desc: 'XONG GIAO LƯU' }
        ];

        const setupView = document.getElementById('setup-view');
        const stepRoleContainer = document.getElementById('step-role-container');
        const stepJobContainer = document.getElementById('step-job-container');
        const stepCasterDeskContainer = document.getElementById('step-caster-desk-container');
        const setupStepTitle = document.getElementById('setup-step-title');

        if (!role) {
            setupView.classList.remove('hidden');
            stepRoleContainer.classList.remove('hidden');
            stepJobContainer.classList.add('hidden');
            stepCasterDeskContainer.classList.add('hidden');
            setupStepTitle.innerText = "Bước 1: Chọn vai trò truy cập hệ thống";
        } else if (!jobId) {
            setupView.classList.remove('hidden');
            stepRoleContainer.classList.add('hidden');
            stepJobContainer.classList.remove('hidden');
            stepCasterDeskContainer.classList.add('hidden');
            setupStepTitle.innerText = `Bước 2: Chọn Job & Loại hình bàn`;
        } else if (role === 'caster' && !casterId) {
            setupView.classList.remove('hidden');
            stepRoleContainer.classList.add('hidden');
            stepJobContainer.classList.add('hidden');
            stepCasterDeskContainer.classList.remove('hidden');
            setupStepTitle.innerText = `Bước 3: Chọn Bàn (Job: ${jobId} - ${mode.toUpperCase()})`;
        } else {
            startApp();
        }

        window.selectRole = function(selectedRole) {
            urlParams.set('role', selectedRole);
            window.location.search = urlParams.toString();
        };

        window.selectPresetJob = function(jobName, jobMode) {
            urlParams.set('job', cleanJobId(jobName));
            urlParams.set('mode', jobMode);
            window.location.search = urlParams.toString();
        };

        window.submitCustomJob = function(jobMode) {
            const val = document.getElementById('custom-job-input').value.trim();
            if (val) {
                window.selectPresetJob(val, jobMode);
            } else {
                alert("Vui lòng nhập tên Job!");
            }
        };

        window.selectCasterDesk = function(selectedDeskId) {
            urlParams.set('id', selectedDeskId);
            window.location.search = urlParams.toString();
        };

        window.backToRoleStep = function() {
            urlParams.delete('role');
            window.location.search = urlParams.toString();
        };

        window.backToJobStep = function() {
            urlParams.delete('job');
            urlParams.delete('mode');
            window.location.search = urlParams.toString();
        };

        window.resetSetup = function() {
            window.location.href = window.location.pathname;
        };

        document.getElementById('btn-change-job').onclick = resetSetup;
        document.getElementById('btn-caster-reset').onclick = resetSetup;

        function startApp() {
            setupView.classList.add('hidden');

            if (role === 'director') {
                document.getElementById('director-view').classList.remove('hidden');
                document.getElementById('job-badge').innerText = `🏷️ Job: ${jobId} (${mode.toUpperCase()})`;
                renderDirectorButtons('caster_1', 'grid-desk-1', mode);
                renderDirectorButtons('caster_2', 'grid-desk-2', mode);
                initDirectorPanel();
            } else {
                document.getElementById('caster-view').classList.remove('hidden');
                
                const deskBadge = document.getElementById('caster-desk-badge');
                if (casterId === 'caster_1') {
                    deskBadge.innerText = `🎙️ ${jobId.toUpperCase()} (${mode.toUpperCase()}) - BÀN 1`;
                } else {
                    deskBadge.innerText = `🎧 ${jobId.toUpperCase()} (${mode.toUpperCase()}) - BÀN 2`;
                }

                initCasterTablet(casterId);
                requestWakeLock();
            }
        }

        function renderDirectorButtons(targetId, containerId, currentMode) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            const buttons = currentMode === 'mc' ? MC_BUTTONS : CASTER_BUTTONS;

            buttons.forEach(btn => {
                const buttonEl = document.createElement('button');
                buttonEl.id = `btn-${targetId}-${btn.id}`;
                buttonEl.className = `p-3 sm:p-3.5 rounded-2xl font-black text-sm sm:text-base shadow-lg transition active:scale-95 text-left flex flex-col`;
                buttonEl.style.backgroundColor = btn.bg;
                buttonEl.style.color = btn.text;
                if(btn.bg === '#000000') buttonEl.className += ' border-2 border-red-500';

                buttonEl.innerHTML = `
                    <span>${btn.titleEng}</span>
                    <span class="text-[10px] sm:text-xs font-normal opacity-80">${btn.titleVie}</span>
                `;

                const secInputId = targetId === 'caster_1' ? 'input-c1-sec' : 'input-c2-sec';
                buttonEl.onclick = () => sendSignal(targetId, btn.titleEng, btn.titleVie, btn.bg, btn.text, secInputId);

                container.appendChild(buttonEl);
            });
        }

        async function pushSignalToDB(targetId, signalData) {
            const rowId = `${jobId}_${targetId}`;
            await supabaseClient.from('tally_signals').upsert({
                id: rowId,
                payload: signalData
            });
        }

        function initDirectorPanel() {
            supabaseClient
                .channel('director_sync')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'tally_signals' }, (payload) => {
                    const row = payload.new;
                    if (row && row.id && row.id.startsWith(jobId + '_')) {
                        const targetId = row.id.replace(jobId + '_', '');
                        const data = row.payload;
                        const monitorEl = document.getElementById(targetId === 'caster_1' ? 'monitor-c1' : 'monitor-c2');
                        if (monitorEl && data && data.titleEng) {
                            monitorEl.innerText = data.titleEng + ' (' + data.titleVie + ')';
                            monitorEl.style.backgroundColor = data.bgColor || '#1e293b';
                            monitorEl.style.color = data.textColor || '#ffffff';
                        }
                    }
                })
                .subscribe();

            document.getElementById('btn-c1-sendmsg').onclick = () => sendQuickMsg('caster_1', 'input-c1-msg');
            document.getElementById('btn-c1-clearmsg').onclick = () => clearQuickMsg('caster_1');
            document.getElementById('btn-c2-sendmsg').onclick = () => sendQuickMsg('caster_2', 'input-c2-msg');
            document.getElementById('btn-c2-clearmsg').onclick = () => clearQuickMsg('caster_2');
        }

        async function sendSignal(targetId, titleEng, titleVie, bgColor, textColor, secInputId) {
            const countdownSec = parseInt(document.getElementById(secInputId).value) || 0;
            const rowId = `${jobId}_${targetId}`;
            
            const { data } = await supabaseClient.from('tally_signals').select('payload').eq('id', rowId).single();
            const existingMsg = (data && data.payload && data.payload.message) ? data.payload.message : '';

            await pushSignalToDB(targetId, {
                titleEng,
                titleVie,
                bgColor,
                textColor,
                message: existingMsg,
                countdownSec,
                triggerTime: Date.now()
            });
        }

        async function sendQuickMsg(targetId, inputId) {
            const input = document.getElementById(inputId);
            const msg = input.value.trim();
            if(!msg) return;

            const rowId = `${jobId}_${targetId}`;
            const { data } = await supabaseClient.from('tally_signals').select('payload').eq('id', rowId).single();
            const currentPayload = data ? data.payload : { titleEng: 'STANDBY', titleVie: 'SẴN SÀNG', bgColor: '#059669', textColor: '#ffffff' };
            currentPayload.message = msg;
            currentPayload.triggerTime = Date.now();

            await pushSignalToDB(targetId, currentPayload);
            input.value = '';
        }

        async function clearQuickMsg(targetId) {
            const rowId = `${jobId}_${targetId}`;
            const { data } = await supabaseClient.from('tally_signals').select('payload').eq('id', rowId).single();
            if (data && data.payload) {
                const currentPayload = data.payload;
                currentPayload.message = '';
                currentPayload.triggerTime = Date.now();
                await pushSignalToDB(targetId, currentPayload);
            }
        }

        let lastTriggerTime = 0;
        let activeTimer = null;

        async function initCasterTablet(targetId) {
            const mainBody = document.getElementById('main-body');
            const statusBadge = document.getElementById('status-badge');
            const statusSubtext = document.getElementById('status-subtext');
            const customMsg = document.getElementById('custom-msg');
            const countdownBanner = document.getElementById('caster-countdown-banner');
            const timerNum = document.getElementById('caster-timer-num');

            const rowId = `${jobId}_${targetId}`;

            const { data } = await supabaseClient.from('tally_signals').select('payload').eq('id', rowId).single();
            if (data && data.payload) {
                applySignalData(data.payload);
            }

            supabaseClient
                .channel('caster_sync_' + targetId)
                .on('postgres_changes', { event: '*', schema: 'public', table: 'tally_signals', filter: `id=eq.${rowId}` }, (payload) => {
                    if (payload.new && payload.new.payload) {
                        applySignalData(payload.new.payload);
                    }
                })
                .subscribe();

            function applySignalData(data) {
                if (data.bgColor) {
                    mainBody.style.backgroundColor = data.bgColor;
                    mainBody.style.color = data.textColor || '#ffffff';
                    statusBadge.innerText = data.titleEng || 'STANDBY';
                    statusSubtext.innerText = data.titleVie || 'SẴN SÀNG';
                }

                if (data.message !== undefined) {
                    if (data.message && data.message.trim() !== '') {
                        customMsg.innerText = `⚠️ LỜI NHẮC: ${data.message}`;
                        customMsg.classList.remove('hidden');
                    } else {
                        customMsg.classList.add('hidden');
                    }
                }

                if (data.triggerTime && data.triggerTime !== lastTriggerTime) {
                    lastTriggerTime = data.triggerTime;

                    if (activeTimer) clearInterval(activeTimer);

                    if (data.countdownSec && data.countdownSec > 0) {
                        let remainingSec = data.countdownSec;
                        countdownBanner.classList.remove('hidden');
                        timerNum.innerText = remainingSec;

                        activeTimer = setInterval(() => {
                            remainingSec--;
                            if (remainingSec > 0) {
                                timerNum.innerText = remainingSec;
                            } else {
                                clearInterval(activeTimer);
                                countdownBanner.classList.add('hidden');
                            }
                        }, 1000);
                    } else {
                        countdownBanner.classList.add('hidden');
                    }
                }
            }
        }

        let wakeLock = null;
        async function requestWakeLock() {
            const statusEl = document.getElementById('wake-lock-status');
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    if (statusEl) statusEl.innerText = '💡 Screen Wake Lock: ACTIVE';
                    wakeLock.addEventListener('release', () => {});
                }
            } catch (err) {}
        }

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });
    </script>
</body>
</html>
